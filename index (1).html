<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2A1230">
<meta name="robots" content="noindex">
<title>Panel · La Barra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --ink:#2A1230; --ink-2:#5E4A64; --ink-3:#8B7A90;
  --paper:#FFFFFF; --ice:#F5F1F6; --line:#E8E1EA;
  --fresa:#E5336A; --fresa-d:#C81F55; --ok:#1E9E57; --amber:#D98A2C;
  --display:"Shrikhand",Georgia,serif; --text:"Onest",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ice);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--fresa);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}

.top{background:var(--ink);color:#fff}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:14px;padding-bottom:14px}
.top #pwToggle{margin-left:auto}
.top b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1}
.top span{color:#D8C9DC;font-size:15px}
.top button{color:#D8C9DC;font-size:14px;font-weight:600;padding:6px 10px;border-radius:8px}
.top button:hover{background:rgba(255,255,255,.08)}

.card{background:#fff;border-radius:18px;padding:18px;margin-top:14px}
.card h2{font-size:18px;font-weight:800;margin-bottom:12px}
.muted{color:var(--ink-3);font-size:14px}

/* Login */
.login{max-width:380px;margin:60px auto 0;padding:0 16px}
.login .logo{font-family:var(--display);font-size:46px;line-height:1}
.login p{color:var(--ink-2);margin:6px 0 22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field input,.field textarea{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;font-size:16px;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--ink)}
.field textarea{resize:vertical;min-height:64px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 16px;border-radius:12px;font-weight:700;font-size:16px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.main{background:var(--ink);color:#fff}
.btn.ghost{background:var(--ice);color:var(--ink)}
.link{color:var(--fresa-d);font-weight:600;text-decoration:underline;text-underline-offset:3px;margin-top:14px;display:inline-block}
.msg{margin-top:12px;font-size:15px;border-radius:12px;padding:11px 13px}
.msg.err{background:#FDECF1;color:#8E1B45}
.msg.ok{background:#EAF7EF;color:#14683A}

/* Estado */
.state{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:700;line-height:1.3}
.state i{width:12px;height:12px;border-radius:50%;flex:none;background:var(--ink-3)}
.state.open i{background:var(--ok);box-shadow:0 0 0 5px rgba(30,158,87,.15)}
.state.closed i{background:var(--fresa)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:16px}
.mode{padding:12px 12px;border-radius:12px;background:var(--ice);font-weight:600;font-size:15px;text-align:left;line-height:1.25;border:1.5px solid transparent}
.mode small{display:block;font-weight:400;color:var(--ink-3);font-size:13px;margin-top:2px}
.mode.on{background:#fff;border-color:var(--ink)}
.row{display:flex;gap:8px;margin-top:10px}
.row .btn{width:auto;flex:1;padding:11px 14px;font-size:15px}

/* Resumen */
.sums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sum{background:var(--ice);border-radius:14px;padding:12px 14px}
.sum span{display:block;color:var(--ink-3);font-size:13px;font-weight:600}
.sum b{display:block;font-size:22px;font-weight:800;margin-top:2px}

/* Pedidos */
.filters{display:flex;gap:6px;background:var(--ice);border-radius:12px;padding:3px;margin-bottom:6px}
.filters button{flex:1;padding:9px;border-radius:9px;font-weight:600;font-size:15px;color:var(--ink-2)}
.filters button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(42,18,48,.14)}
.order{border-top:1px solid var(--line);padding:16px 0}
.order:first-of-type{border-top:0}
.oh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.oh .folio{font-weight:800;font-size:18px}
.oh .who{font-weight:600}
.oh .at{color:var(--ink-3);font-size:14px;margin-left:auto}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--ice)}
.badge.nuevo{background:#FDECF1;color:#B3174A}
.badge.preparando{background:#FFF3E0;color:#9A5B10}
.badge.en_camino{background:#E7F0FD;color:#1F5FB8}
.badge.listo{background:#F1E8FB;color:#6A2BB3}
.badge.entregado{background:#EAF7EF;color:#14683A}
.badge.cancelado{background:var(--ice);color:var(--ink-3);text-decoration:line-through}
.meta{color:var(--ink-2);font-size:14px;margin-top:4px}
.items{margin:10px 0 0;list-style:none;font-size:15px}
.items li{display:flex;gap:10px;padding:3px 0}
.items li span:first-child{flex:1}
.items li small{display:block;color:var(--ink-3);font-size:13px}
.ototal{display:flex;justify-content:space-between;font-weight:800;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.notes{margin-top:8px;background:#FFF8E6;border-radius:10px;padding:8px 10px;font-size:14px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.actions button{padding:9px 12px;border-radius:10px;background:var(--ice);font-weight:600;font-size:14px}
.actions button.next{background:var(--ink);color:#fff}
.actions a.wa{display:inline-flex;align-items:center;gap:6px;padding:9px 12px;border-radius:10px;background:#E6F7EC;color:#14683A;font-weight:600;font-size:14px;text-decoration:none}
.actions a.wa svg{width:16px;height:16px}
.meta a{color:inherit;white-space:nowrap}
.actions button.cancel{color:var(--fresa-d);margin-left:auto}
.empty{color:var(--ink-3);padding:18px 0;text-align:center}
.order.fresh{animation:fresh 2.4s ease}
@keyframes fresh{0%,40%{background:#FDECF1}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.order.fresh{animation:none}}

.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-200%);opacity:0;z-index:60;background:var(--fresa);color:#fff;font-weight:700;font-size:15px;padding:11px 18px;border-radius:12px;box-shadow:0 8px 24px rgba(42,18,48,.25);transition:transform .25s ease,opacity .2s}
.toast.show{transform:translate(-50%,0);opacity:1}
@media (max-width:520px){.sums{grid-template-columns:1fr 1fr}.sum:last-child{grid-column:span 2}}
</style>
</head>
<body>

<!-- Entrar -->
<section class="login" id="vLogin" hidden>
  <div class="logo">La Barra</div>
  <p>Panel de pedidos</p>
  <form id="loginForm">
    <div class="field"><label for="user">Usuario</label><input id="user" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
    <div class="field"><label for="pass">Contraseña</label><input id="pass" type="password" autocomplete="current-password" minlength="8" required></div>
    <div class="field" id="pass2Field" hidden><label for="pass2">Repite la contraseña</label><input id="pass2" type="password" autocomplete="new-password" minlength="8"></div>
    <button class="btn main" id="loginBtn" type="submit">Entrar</button>
  </form>
  <a href="#" class="link" id="toggleMode">Es mi primera vez: crear contraseña</a>
  <div id="loginMsg"></div>
</section>

<!-- Sin permiso -->
<section class="login" id="vNoAccess" hidden>
  <div class="logo">La Barra</div>
  <p id="noAccessText"></p>
  <button class="btn ghost" data-logout>Salir</button>
</section>

<!-- Panel -->
<div id="vPanel" hidden>
  <header class="top"><div class="wrap"><b>La Barra</b><span id="whoami">Panel</span><button id="pwToggle">Contraseña</button><button data-logout style="margin-left:0">Salir</button></div></header>
  <main class="wrap" style="padding-bottom:40px">
    <section class="card" id="pwCard" hidden>
      <h2>Cambiar contraseña</h2>
      <div class="field"><label for="newPass">Nueva contraseña <span class="muted">(mínimo 8 caracteres)</span></label><input id="newPass" type="password" autocomplete="new-password" minlength="8"></div>
      <button class="btn main" id="savePass">Guardar contraseña</button>
      <div id="pwMsg"></div>
    </section>

    <section class="card">
      <h2>Cómo está la tienda</h2>
      <div class="state" id="state"><i></i><span id="stateText">Cargando…</span></div>
      <div class="modes" id="modes">
        <button class="mode" data-mode="auto">Según horario<small>Mié a dom, 5 pm a 12 am</small></button>
        <button class="mode" data-mode="hoy">Cerrar hoy<small>Mañana vuelve al horario</small></button>
        <button class="mode" data-mode="indef">Cerrar hasta nuevo aviso<small>Hasta que lo vuelvas a abrir</small></button>
        <button class="mode" data-mode="p30">Pausar 30 minutos<small>Por muchos pedidos</small></button>
        <button class="mode" data-mode="p60">Pausar 1 hora<small>Por muchos pedidos</small></button>
      </div>
      <div class="field" style="margin-top:18px;margin-bottom:0">
        <label for="aviso">Aviso para clientes <span class="muted">(se ve arriba de la carta)</span></label>
        <textarea id="aviso" maxlength="280" placeholder="Por ejemplo: Hoy estamos en un evento privado, volvemos mañana."></textarea>
      </div>
      <div class="row"><button class="btn main" id="saveAviso">Guardar aviso</button><button class="btn ghost" id="clearAviso">Quitar aviso</button></div>
    </section>

    <section class="card">
      <h2>Hoy</h2>
      <div class="sums">
        <div class="sum"><span>Ventas</span><b class="num" id="sVentas">$0</b></div>
        <div class="sum"><span>Pedidos</span><b class="num" id="sPedidos">0</b></div>
        <div class="sum"><span>Ticket promedio</span><b class="num" id="sTicket">$0</b></div>
      </div>
      <p class="muted" style="margin-top:8px">No cuenta los pedidos cancelados.</p>
    </section>

    <section class="card">
      <h2>Pedidos de hoy</h2>
      <div class="filters"><button class="on" data-filter="activos">Por atender</button><button data-filter="todos">Todos</button></div>
      <div id="orders"></div>
    </section>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/panel/app.js"></script>
</body>
</html>
